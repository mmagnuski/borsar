name: borsar
channels:
- conda-forge
dependencies:
- python=${PYTHON_VERSION}
- pip
- mkl
- numpy${NUMPY_SPEC}
# MNE 1.4 and 1.8 import ``scipy.special.sph_harm``, removed in SciPy 1.17.
- scipy${SCIPY_SPEC}
- matplotlib${MATPLOTLIB_SPEC}
- pandas
- xlrd
- scikit-learn
- scikit-image
- h5py
# dev/testing libraries:
- statsmodels
- pytest
- pytest-cov
- psutil
- numpydoc
- flake8
# likely not needed:
- joblib
- pip:
  - h5io
  - pydocstyle
  - codespell
  - sphinx_gallery
  - sphinx_bootstrap_theme
