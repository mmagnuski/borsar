version: 2.1
orbs:
  codecov: codecov/codecov@4.0.1
jobs:
  build:
    docker:
      - image: condaforge/mambaforge:latest
    resource_class: large
    parameters:
      mne_version:
        type: string
        default: "current"
      use_numba:
        type: string
        default: "no"
    steps:
      - checkout
      - run:
          name: Install CI tools
          command: |
            apt-get update
            apt-get install -y curl
      - run:
          name: Create conda env
          command: |
            mamba update -n base -c conda-forge conda
            if [ "<< parameters.mne_version >>" == "1.4.0" ]; then
              mamba env create --strict-channel-priority -f environment_mpl.yml
            else
              mamba env create --strict-channel-priority -f environment.yml
            fi
            source activate borsar

            if [ << parameters.use_numba >> == "yes" ]; then
              mamba install --strict-channel-priority numba -y;
            fi
            if [ << parameters.mne_version >> == "current" ]; then
              pip install mne
            else
              pip install mne==<< parameters.mne_version >>;
            fi
            pip install tqdm
            hash -r pytest
      - run:
          name: Run tests
          command: |
            source activate borsar
            python -m pytest --cov=borsar borsar/ \
                             --cov-report xml:"./coverage.xml"
      - codecov/upload

workflows:
  workflow:
    jobs:
      - build:
          matrix:
            parameters:
              use_numba: ["yes", "no"]
              mne_version: ["current", "1.8.0", "1.4.0"]
